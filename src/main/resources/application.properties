spring.application.name=invoices
server.port=${INVOICES_SERVER_PORT:8083}
spring.config.import=classpath:config/private.properties

springdoc.api-docs.enabled=true

# app.pagination.page-size=25
# app.pagination.max-page-size=100

spring.datasource.url=${db.url}?user=${db.username}&password=${db.password}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Logs
logging.file.name=app.log
logging.level.com.jerokysys.invoices=INFO
logging.level.com.jerokysys.invoices.controllers=INFO
logging.level.com.jerokysys.invoices.services=DEBUG
logging.level.com.jerokysys.invoices.repo=DEBUG
logging.logback.rollingpolicy.max-file-size=10MB

# ------------
# Redis Cache
# ------------
# Una instancia de Redis para este microservicio. Todos los valores salen de
# este archivo; el codigo no tiene literales de cache.
cache.enabled=${CACHE_ENABLED:true}
cache.key-prefix=invoices
cache.default-ttl-seconds=120
cache.scan-batch-size=100
# Dominios (secciones). Segundos; 0 = persistente, sin expiracion.
cache.domains.invoice=30
cache.domains.invoicedetail=30
cache.domains.taxstamp=300

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.database=0
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.connect-timeout=2s
spring.data.redis.timeout=2s

# Una linea por operacion de cache. Poner en WARN para silenciarla.
logging.level.com.jerokysys.invoices.config.LoggingCache=${CACHE_LOG_LEVEL:INFO}

# Dirección del servidor Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# Registrar usando IP en lugar del hostname
eureka.instance.prefer-ip-address=true

# Clave con la que se firma el token; debe ser EXACTAMENTE la misma que jwt.secret en jerokysys-auth.
jwt.secret=${JWT_SECRET:nQic8KmHIa0kK7cpRVjLCVHHqMNBsZVmc3191egDTnE=}
# Seguridad JWT (token emitido por el MS auth)
jwt.claim.user=username
jwt.claim.role=role

# Evitar logs verbosos de seguridad que puedan filtrar detalles del token
logging.level.org.springframework.security=INFO