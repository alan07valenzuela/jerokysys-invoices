openapi: 3.0.3

info:
  title: JerokySys - MS2 Cobro de Facturas
  description: |
    Microservicio de cobro del sistema JerokySys. Es dueño de `Invoice`, `InvoiceDetail`,
    `TaxStamp` y de los enumerados `InvoiceStatus`, `SaleCondition` y `VatType`.

    Las entidades, los DTOs de entidad y las clases base provienen del JAR `commons`
    (Entrega #1). Este servicio los consume sin modificarlos.

    La factura es un documento autocontenido: guarda un snapshot del cliente y del
    emisor, y no tiene FK a `Student`. El frontend resuelve los datos fiscales del
    estudiante o guardián y los envia en el `InvoiceDTO`.

    Los precios unitarios incluyen IVA. El IVA no se suma al total: se liquida como
    `sales5 / 21` y `sales10 / 11`.

    Los controllers se escriben a mano contra `commons` (`BaseController`,
    `AbstractBaseService`) y este archivo documenta el contrato: no se genera codigo
    desde el.

  version: 1.0.0
  contact:
    name: MS2 - Cobro de Facturas

servers:
  - url: http://localhost:8083
    description: Local

tags:
  - name: Invoice
    description: Cabecera de factura. Cliente, emisor, timbrado, condicion de venta y estado de pago.
  - name: InvoiceDetail
    description: Lineas de detalle de la factura. Solo lectura; se escriben dentro de la factura.
  - name: TaxStamp
    description: Timbrados autorizados, vigencia y correlativo.

# ==============================================================================
# Rutas.
#
# Todos los endpoints devuelven el sobre `Response<T>` de commons
# ({ data, message, status, success }) y las lecturas paginadas usan
# `Response<PageResult<T>>`. Los endpoints de filtro devuelven
# `Response<List<T>>` sin paginar, igual que en academic.
# ==============================================================================
paths:

  # ==========================================================================
  # FACTURAS
  # ==========================================================================
  /invoices:
    get:
      tags: [Invoice]
      summary: Lista facturas, paginadas
      description: Devuelve una pagina de facturas sin cargar sus lineas de detalle.
      operationId: listInvoices
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
        - $ref: '#/components/parameters/SortParam'
        - $ref: '#/components/parameters/DirectionParam'
      responses:
        '200':
          description: Pagina de facturas.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseInvoicePage'
        '400': { $ref: '#/components/responses/BadRequest' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      tags: [Invoice]
      summary: Registra una factura
      description: |
        Crea la factura junto con sus lineas de detalle.

        El servidor ignora la numeracion y los totales que envie el cliente: bloquea
        el timbrado, asigna el correlativo y calcula los importes desde `details`.

        Los precios unitarios incluyen IVA. El IVA no se suma al total:
        `iva5 = sales5 / 21` e `iva10 = sales10 / 11`.

        Una factura sin lineas se rechaza. La cabecera y las lineas se guardan en una
        sola transaccion, junto con el incremento del correlativo del timbrado.
      operationId: createInvoice
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvoiceDTO'
      responses:
        '201':
          description: Factura creada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseInvoice'
        '400': { $ref: '#/components/responses/BadRequest' }
        '500': { $ref: '#/components/responses/InternalError' }

  /invoices/{id}:
    parameters:
      - $ref: '#/components/parameters/IdParam'
    get:
      tags: [Invoice]
      summary: Obtiene una factura por id
      description: Devuelve la factura con todas sus lineas de detalle.
      operationId: getInvoiceById
      responses:
        '200':
          description: Factura encontrada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseInvoice'
        '400': { $ref: '#/components/responses/BadRequest' }
        '500': { $ref: '#/components/responses/InternalError' }
    put:
      tags: [Invoice]
      summary: Actualiza una factura
      description: |
        Reemplaza las lineas de detalle por las que envie el cuerpo y recalcula los
        totales. Solo las facturas `PENDING` admiten cambios.

        No se modifican la numeracion, el timbrado, los snapshots del emisor ni
        `issueDate`. La cabecera y las lineas se guardan en una sola transaccion.
      operationId: updateInvoice
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvoiceDTO'
      responses:
        '200':
          description: Factura actualizada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseInvoice'
        '400': { $ref: '#/components/responses/BadRequest' }
        '500': { $ref: '#/components/responses/InternalError' }
    delete:
      tags: [Invoice]
      summary: Anula logicamente una factura
      description: |
        Borrado logico: la fila queda con `active = false` y `deleted = true`, nunca se
        borra fisicamente. Solo actua sobre facturas `PENDING` y propaga el borrado a
        las lineas de detalle. El correlativo consumido no se reutiliza.
      operationId: deleteInvoice
      responses:
        '204':
          description: Factura anulada logicamente. Sin cuerpo.
        '400': { $ref: '#/components/responses/BadRequest' }
        '500': { $ref: '#/components/responses/InternalError' }

  /invoices/{id}/status:
    parameters:
      - $ref: '#/components/parameters/IdParam'
    patch:
      tags: [Invoice]
      summary: Cambia el estado de pago de la factura
      description: |
        Transiciones validas: `PENDING` a `PAID` y `PENDING` a `CANCELLED`.
        `PAID` y `CANCELLED` son estados finales, no hay retroceso, y pedir `PENDING`
        como destino es un error de validacion.
      operationId: changeInvoiceStatus
      parameters:
        - name: status
          in: query
          required: true
          description: Nuevo estado de pago.
          schema: { $ref: '#/components/schemas/InvoiceStatus' }
          example: PAID
      responses:
        '200':
          description: Estado actualizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseInvoice'
        '400': { $ref: '#/components/responses/BadRequest' }
        '500': { $ref: '#/components/responses/InternalError' }

  # --------------------------------------------------------------------------
  # Filtros. Uno por endpoint, cada uno con un unico parametro, al estilo de
  # academic (`/by-customer-ruc`, `/by-status`, `/by-date`...). No se combinan entre si.
  # --------------------------------------------------------------------------
  /invoices/by-customer-ruc:
    get:
      tags: [Invoice]
      summary: Facturas de un cliente por RUC
      operationId: getInvoicesByCustomerRuc
      parameters:
        - name: ruc
          in: query
          required: true
          schema: { type: string, maxLength: 20 }
          example: '80012345-6'
      responses:
        '200':
          description: Facturas de ese cliente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseInvoiceList'
        '500': { $ref: '#/components/responses/InternalError' }

  /invoices/by-student/{studentId}:
    get:
      tags: [Invoice]
      summary: Facturas de un alumno
      operationId: getInvoicesByStudent
      parameters:
        - name: studentId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: Facturas del alumno.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseInvoiceList'
        '500': { $ref: '#/components/responses/InternalError' }

  /invoices/by-status:
    get:
      tags: [Invoice]
      summary: Facturas por estado de pago
      operationId: getInvoicesByStatus
      parameters:
        - name: status
          in: query
          required: true
          schema: { type: string }
          example: PAID
      responses:
        '200':
          description: Facturas en ese estado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseInvoiceList'
        '400': { $ref: '#/components/responses/BadRequest' }
        '500': { $ref: '#/components/responses/InternalError' }

  /invoices/by-sale-condition:
    get:
      tags: [Invoice]
      summary: Facturas por condicion de venta
      operationId: getInvoicesBySaleCondition
      parameters:
        - name: condition
          in: query
          required: true
          schema: { type: string }
          example: CREDITO
      responses:
        '200':
          description: Facturas con esa condicion.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseInvoiceList'
        '400': { $ref: '#/components/responses/BadRequest' }
        '500': { $ref: '#/components/responses/InternalError' }

  /invoices/by-number:
    get:
      tags: [Invoice]
      summary: Facturas por numero fiscal exacto
      operationId: getInvoicesByNumber
      parameters:
        - name: invoiceNumber
          in: query
          required: true
          schema: { type: string, maxLength: 20 }
          example: 001-001-0000123
      responses:
        '200':
          description: Facturas con ese numero.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseInvoiceList'
        '500': { $ref: '#/components/responses/InternalError' }

  /invoices/by-stamp-number:
    get:
      tags: [Invoice]
      summary: Facturas por numero de timbrado
      operationId: getInvoicesByStampNumber
      parameters:
        - name: stampNumber
          in: query
          required: true
          schema: { type: string, maxLength: 20 }
          example: '12345678'
      responses:
        '200':
          description: Facturas de ese timbrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseInvoiceList'
        '500': { $ref: '#/components/responses/InternalError' }

  /invoices/search-by-customer-name:
    get:
      tags: [Invoice]
      summary: Facturas por coincidencia parcial en el nombre del cliente
      operationId: searchInvoicesByCustomerName
      parameters:
        - name: customerName
          in: query
          required: true
          description: Substring, sin distinguir mayusculas.
          schema: { type: string }
          example: Perez
      responses:
        '200':
          description: Facturas que coinciden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseInvoiceList'
        '500': { $ref: '#/components/responses/InternalError' }

  /invoices/by-date:
    get:
      tags: [Invoice]
      summary: Facturas emitidas en una fecha exacta
      operationId: getInvoicesByDate
      parameters:
        - name: date
          in: query
          required: true
          schema: { type: string, format: date }
          example: '2026-03-01'
      responses:
        '200':
          description: Facturas de esa fecha.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseInvoiceList'
        '500': { $ref: '#/components/responses/InternalError' }

  /invoices/by-date-range:
    get:
      tags: [Invoice]
      summary: Facturas emitidas en un rango de fechas
      operationId: getInvoicesByDateRange
      parameters:
        - name: from
          in: query
          required: true
          schema: { type: string, format: date }
          example: '2026-01-01'
        - name: to
          in: query
          required: true
          schema: { type: string, format: date }
          example: '2026-03-31'
      responses:
        '200':
          description: Facturas del rango, inclusive en los extremos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseInvoiceList'
        '500': { $ref: '#/components/responses/InternalError' }

  /invoices/by-amount-range:
    get:
      tags: [Invoice]
      summary: Facturas por rango de importe total
      operationId: getInvoicesByAmountRange
      parameters:
        - name: min
          in: query
          required: true
          schema: { type: number }
          example: 100
        - name: max
          in: query
          required: true
          schema: { type: number }
          example: 500
      responses:
        '200':
          description: Facturas del rango, inclusive en los extremos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseInvoiceList'
        '500': { $ref: '#/components/responses/InternalError' }

  # ==========================================================================
  # TIMBRADOS
  # ==========================================================================
  /tax-stamps:
    get:
      tags: [TaxStamp]
      summary: Lista timbrados, paginados
      operationId: listTaxStamps
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
        - $ref: '#/components/parameters/SortParam'
        - $ref: '#/components/parameters/DirectionParam'
      responses:
        '200':
          description: Pagina de timbrados.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseTaxStampPage'
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      tags: [TaxStamp]
      summary: Crea un timbrado
      operationId: createTaxStamp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaxStampDTO'
      responses:
        '201':
          description: Timbrado creado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseTaxStamp'
        '400': { $ref: '#/components/responses/BadRequest' }
        '500': { $ref: '#/components/responses/InternalError' }

  /tax-stamps/valid:
    get:
      tags: [TaxStamp]
      summary: Timbrados vigentes en una fecha
      operationId: getValidTaxStamps
      parameters:
        - name: date
          in: query
          required: false
          schema: { type: string, format: date }
          example: '2026-03-01'
      responses:
        '200':
          description: Timbrados vigentes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseTaxStampList'
        '500': { $ref: '#/components/responses/InternalError' }

  /tax-stamps/{id}:
    get:
      tags: [TaxStamp]
      summary: Obtiene un timbrado por id
      operationId: getTaxStampById
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: Timbrado encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseTaxStamp'
        '400': { $ref: '#/components/responses/BadRequest' }
        '500': { $ref: '#/components/responses/InternalError' }
    put:
      tags: [TaxStamp]
      summary: Actualiza un timbrado
      operationId: updateTaxStamp
      parameters:
        - $ref: '#/components/parameters/IdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaxStampDTO'
      responses:
        '200':
          description: Timbrado actualizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseTaxStamp'
        '400': { $ref: '#/components/responses/BadRequest' }
        '500': { $ref: '#/components/responses/InternalError' }
    delete:
      tags: [TaxStamp]
      summary: Borra logicamente un timbrado
      operationId: deleteTaxStamp
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '204':
          description: Timbrado borrado.
        '400': { $ref: '#/components/responses/BadRequest' }
        '500': { $ref: '#/components/responses/InternalError' }

  # ==========================================================================
  # LINEAS DE DETALLE (solo lectura)
  # ==========================================================================
  /invoice-details:
    get:
      tags: [InvoiceDetail]
      summary: Lista lineas de detalle, paginadas
      operationId: listInvoiceDetails
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
        - $ref: '#/components/parameters/SortParam'
        - $ref: '#/components/parameters/DirectionParam'
      responses:
        '200':
          description: Pagina de lineas de detalle.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseInvoiceDetailPage'
        '500': { $ref: '#/components/responses/InternalError' }

  /invoice-details/{id}:
    parameters:
      - $ref: '#/components/parameters/IdParam'
    get:
      tags: [InvoiceDetail]
      summary: Obtiene una linea de detalle por id
      operationId: getInvoiceDetailById
      responses:
        '200':
          description: Linea encontrada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseInvoiceDetail'
        '400': { $ref: '#/components/responses/BadRequest' }
        '500': { $ref: '#/components/responses/InternalError' }

  /invoice-details/by-invoice/{invoiceId}:
    get:
      tags: [InvoiceDetail]
      summary: Lineas de una factura
      operationId: getInvoiceDetailsByInvoice
      parameters:
        - name: invoiceId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: Lineas de la factura.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseInvoiceDetailList'
        '500': { $ref: '#/components/responses/InternalError' }

  /invoice-details/by-month:
    get:
      tags: [InvoiceDetail]
      summary: Lineas imputadas a un mes
      operationId: getInvoiceDetailsByMonth
      parameters:
        - name: month
          in: query
          required: true
          description: Mes de imputacion, formato `AAAA-MM`.
          schema: { type: string, maxLength: 20 }
          example: '2026-03'
      responses:
        '200':
          description: Lineas de ese mes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseInvoiceDetailList'
        '500': { $ref: '#/components/responses/InternalError' }

  /invoice-details/by-vat-type:
    get:
      tags: [InvoiceDetail]
      summary: Lineas por tratamiento de IVA
      operationId: getInvoiceDetailsByVatType
      parameters:
        - name: vatType
          in: query
          required: true
          schema: { type: string, enum: [EXENTA, GRAVADA_5, GRAVADA_10] }
          example: GRAVADA_10
      responses:
        '200':
          description: Lineas con ese tratamiento.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseInvoiceDetailList'
        '400': { $ref: '#/components/responses/BadRequest' }
        '500': { $ref: '#/components/responses/InternalError' }

  /invoice-details/by-concept:
    get:
      tags: [InvoiceDetail]
      summary: Lineas que apuntan a un concepto facturado
      description: |
        Busca por el token que viaja dentro de `description`, por ejemplo
        `[MATRICULA#12]`. El esquema compartido no tiene columnas `enrollment_id` ni
        `exam_id`, asi que el concepto se referencia por ese token.
      operationId: getInvoiceDetailsByConcept
      parameters:
        - name: conceptType
          in: query
          required: true
          schema: { type: string, enum: [MATRICULA, EXAMEN] }
        - name: conceptId
          in: query
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: Lineas del concepto.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseInvoiceDetailList'
        '400': { $ref: '#/components/responses/BadRequest' }
        '500': { $ref: '#/components/responses/InternalError' }

  /invoice-details/by-subtotal-range:
    get:
      tags: [InvoiceDetail]
      summary: Lineas por rango de subtotal
      operationId: getInvoiceDetailsBySubtotalRange
      parameters:
        - name: min
          in: query
          required: true
          schema: { type: number }
        - name: max
          in: query
          required: true
          schema: { type: number }
      responses:
        '200':
          description: Lineas del rango, inclusive en los extremos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseInvoiceDetailList'
        '500': { $ref: '#/components/responses/InternalError' }

  /invoice-details/search-by-description:
    get:
      tags: [InvoiceDetail]
      summary: Lineas por coincidencia parcial en la descripcion
      operationId: searchInvoiceDetailsByDescription
      parameters:
        - name: description
          in: query
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Lineas que coinciden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseInvoiceDetailList'
        '500': { $ref: '#/components/responses/InternalError' }

# ==============================================================================
components:

  parameters:
    IdParam:
      name: id
      in: path
      required: true
      schema: { type: integer, format: int64 }
    PageParam:
      name: page
      in: query
      description: Indice de pagina, empieza en 0.
      schema: { type: integer, default: 0, minimum: 0 }
    SizeParam:
      name: size
      in: query
      description: Elementos por pagina.
      schema: { type: integer, default: 10, minimum: 1 }
    SortParam:
      name: sort
      in: query
      description: Campo por el que se ordena.
      schema: { type: string, default: id }
    DirectionParam:
      name: direction
      in: query
      description: Sentido del orden.
      schema: { type: string, default: ASC, enum: [ASC, DESC] }

  responses:
    BadRequest:
      description: |
        Peticion invalida o fallo de validacion.

        El `GlobalExceptionHandler` de `commons` traduce **toda** `BusinessException` a
        HTTP 400, sin distinguir el `errorCode` (`ENTITY_NOT_FOUND`, `CONFLICT`,
        `VALIDATION_ERROR`, `STAMP_EXPIRED`, `INVOICE_NOT_EDITABLE`), y tampoco
        serializa ese codigo en el cuerpo. Es el mismo comportamiento que en `academic`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ResponseError'
    InternalError:
      description: Error interno. El detalle tecnico queda en el log del servidor.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ResponseError'

  schemas:

    # ==========================================================================
    # ENVOLTORIO (de commons)
    # ==========================================================================
    ResponseError:
      type: object
      description: Sobre de error, con `data` nulo.
      properties:
        data: { nullable: true }
        message: { type: string, example: Invoice not found with id: 999 }
        status: { type: integer, example: 400 }
        success: { type: boolean, example: false }

    ResponseInvoice:
      type: object
      description: Sobre con una factura.
      properties:
        data: { $ref: '#/components/schemas/InvoiceDTO' }
        message: { type: string, example: Success }
        status: { type: integer, example: 200 }
        success: { type: boolean, example: true }

    ResponseInvoiceList:
      type: object
      description: Sobre con una lista de facturas sin paginar.
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/InvoiceDTO' }
        message: { type: string }
        status: { type: integer }
        success: { type: boolean }

    ResponseInvoicePage:
      type: object
      properties:
        data: { $ref: '#/components/schemas/PageResultInvoice' }
        message: { type: string }
        status: { type: integer }
        success: { type: boolean }

    PageResultInvoice:
      type: object
      description: Sobre de paginacion (`commons.common.PageResult`).
      properties:
        content:
          type: array
          items: { $ref: '#/components/schemas/InvoiceDTO' }
        totalElements: { type: integer, format: int64, example: 137 }
        totalPages: { type: integer, format: int32, example: 14 }
        page: { type: integer, format: int32, example: 0 }
        size: { type: integer, format: int32, example: 10 }

    ResponseInvoiceDetail:
      type: object
      properties:
        data: { $ref: '#/components/schemas/InvoiceDetailDTO' }
        message: { type: string }
        status: { type: integer }
        success: { type: boolean }

    ResponseInvoiceDetailList:
      type: object
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/InvoiceDetailDTO' }
        message: { type: string }
        status: { type: integer }
        success: { type: boolean }

    ResponseInvoiceDetailPage:
      type: object
      properties:
        data: { $ref: '#/components/schemas/PageResultInvoiceDetail' }
        message: { type: string }
        status: { type: integer }
        success: { type: boolean }

    PageResultInvoiceDetail:
      type: object
      properties:
        content:
          type: array
          items: { $ref: '#/components/schemas/InvoiceDetailDTO' }
        totalElements: { type: integer, format: int64 }
        totalPages: { type: integer, format: int32 }
        page: { type: integer, format: int32 }
        size: { type: integer, format: int32 }

    ResponseTaxStamp:
      type: object
      properties:
        data: { $ref: '#/components/schemas/TaxStampDTO' }
        message: { type: string }
        status: { type: integer }
        success: { type: boolean }

    ResponseTaxStampList:
      type: object
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/TaxStampDTO' }
        message: { type: string }
        status: { type: integer }
        success: { type: boolean }

    ResponseTaxStampPage:
      type: object
      properties:
        data: { $ref: '#/components/schemas/PageResultTaxStamp' }
        message: { type: string }
        status: { type: integer }
        success: { type: boolean }

    PageResultTaxStamp:
      type: object
      properties:
        content:
          type: array
          items: { $ref: '#/components/schemas/TaxStampDTO' }
        totalElements: { type: integer, format: int64 }
        totalPages: { type: integer, format: int32 }
        page: { type: integer, format: int32 }
        size: { type: integer, format: int32 }

    # ==========================================================================
    # ENUMERADOS (del JAR de commons)
    # ==========================================================================
    InvoiceStatus:
      type: string
      description: Estado del pago de la factura
      enum:
        - PENDING
        - PAID
        - CANCELLED

    SaleCondition:
      type: string
      description: Condicion de venta pactada con el cliente
      enum:
        - CONTADO
        - CREDITO

    VatType:
      type: string
      description: Tratamiento tributario de la linea
      enum:
        - EXENTA
        - GRAVADA_5
        - GRAVADA_10

    InvoiceConceptType:
      type: string
      description: Concepto facturado en la linea
      enum:
        - MATRICULA
        - CUOTA
        - EXAMEN
        - OTRO

    # ==========================================================================
    # DTOs DE ENTIDAD (del JAR de commons)
    # ==========================================================================
    InvoiceDetailDTO:
      type: object
      description: |
        Linea de detalle de una factura.

        `unitPrice` incluye IVA. `subtotal` es `quantity * unitPrice` y lo calcula
        el servidor. La referencia al concepto facturado viaja dentro de
        `description` con un token entre corchetes al final (`[MATRICULA#12]`).
      properties:
        id:
          type: integer
          format: int64
          readOnly: true

        invoiceId:
          type: integer
          format: int64
          readOnly: true

        description:
          type: string
          maxLength: 255
          description: Concepto facturado. Si referencia una matricula o un examen, debe incluir el token entre corchetes.

        quantity:
          type: number
          description: Cantidad facturada. Debe ser mayor que cero.

        unitPrice:
          type: number
          description: Precio unitario con IVA incluido.

        subtotal:
          type: number
          readOnly: true
          description: Valor de venta de la linea, con IVA incluido.

        vatType:
          $ref: '#/components/schemas/VatType'

        conceptType:
          $ref: '#/components/schemas/InvoiceConceptType'

        conceptId:
          type: integer
          format: int64

        correspondingMonth:
          type: string
          maxLength: 7
          description: Mes al que se imputa el cargo, en formato `AAAA-MM`.
          example: '2026-03'

      required:
        - description
        - quantity
        - unitPrice
        - vatType

    InvoiceDTO:
      type: object
      description: |
        Factura. El servidor asigna la numeracion y calcula los totales a partir de
        `details`; los valores de solo lectura que envie el cliente se ignoran.

        Los precios de las lineas incluyen IVA. El IVA no se suma al total: se
        liquida como `sales5 / 21` y `sales10 / 11`.
      properties:
        id:
          type: integer
          format: int64
          readOnly: true

        studentId:
          type: integer
          format: int64
          description: Alumno beneficiario. Referencia para filtrar; el cliente fiscal se guarda en `customer*`.

        taxStampId:
          type: integer
          format: int64
          description: Timbrado seleccionado. El backend lo bloquea y asigna el correlativo.

        establishmentCode:
          type: string
          maxLength: 3
          readOnly: true

        expeditionPoint:
          type: string
          maxLength: 3
          readOnly: true

        sequenceNumber:
          type: integer
          format: int32
          readOnly: true

        invoiceNumber:
          type: string
          maxLength: 20
          readOnly: true
          description: Numero generado por el servidor con formato `AAA-AAA-NNNNNNN`.

        issueDate:
          type: string
          format: date
          description: Fecha de emision.

        dueDate:
          type: string
          format: date
          description: Vencimiento, para ventas a credito.

        saleCondition:
          $ref: '#/components/schemas/SaleCondition'

        paymentStatus:
          $ref: '#/components/schemas/InvoiceStatus'

        customerName:
          type: string
          maxLength: 150
          description: Nombre o razon social del cliente.

        customerRuc:
          type: string
          maxLength: 20
          description: RUC del cliente. La factura no acepta CI.

        customerAddress:
          type: string
          maxLength: 255

        issuerName:
          type: string
          maxLength: 150
          description: Snapshot del emisor al emitir la factura.

        issuerRuc:
          type: string
          maxLength: 20
          description: Debe coincidir con el RUC del timbrado.

        issuerActivity:
          type: string

        issuerPhone:
          type: string
          maxLength: 30

        issuerAddress:
          type: string
          maxLength: 255

        issuerEmail:
          type: string
          maxLength: 150

        stampNumber:
          type: string
          maxLength: 20
          readOnly: true

        stampValidFrom:
          type: string
          format: date
          readOnly: true

        stampValidUntil:
          type: string
          format: date
          readOnly: true

        exemptAmount:
          type: number
          readOnly: true

        sales5Amount:
          type: number
          readOnly: true
          description: Ventas al 5%, con IVA incluido.

        sales10Amount:
          type: number
          readOnly: true
          description: Ventas al 10%, con IVA incluido.

        iva5Amount:
          type: number
          readOnly: true
          description: IVA liquidado al 5%, calculado como sales5 / 21.

        iva10Amount:
          type: number
          readOnly: true
          description: IVA liquidado al 10%, calculado como sales10 / 11.

        totalAmount:
          type: number
          readOnly: true
          description: Suma de exentas, ventas 5% y ventas 10%. El IVA ya esta incluido.

        totalIva:
          type: number
          readOnly: true
          description: Suma de iva5Amount e iva10Amount. Es informativo.

        details:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/InvoiceDetailDTO'

      required:
        - taxStampId
        - issueDate
        - customerName
        - customerRuc
        - issuerName
        - issuerRuc
        - issuerActivity
        - issuerAddress
        - details

    TaxStampDTO:
      type: object
      description: Timbrado autorizado y correlativo vigente.
      properties:
        id:
          type: integer
          format: int64
          readOnly: true

        businessRuc:
          type: string
          maxLength: 20

        stampNumber:
          type: string
          maxLength: 20

        establishmentCode:
          type: string
          maxLength: 3

        expeditionPoint:
          type: string
          maxLength: 3

        validFrom:
          type: string
          format: date

        validUntil:
          type: string
          format: date

        nextSequence:
          type: integer
          format: int32
          readOnly: true

        active:
          type: boolean

      required:
        - businessRuc
        - stampNumber
        - establishmentCode
        - expeditionPoint
        - validFrom
        - validUntil